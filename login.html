<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic Tac Toe</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h1 class="h4 mb-0">Tic Tac Toe</h1>
                <div class="d-flex gap-2">
                  <button id="btn-new-round" class="btn btn-primary btn-sm">
                    New Round
                  </button>
                  <button id="btn-reset-scores" class="btn btn-outline-danger btn-sm">
                    Reset Scores
                  </button>
                </div>
              </div>

              <div class="row g-3 align-items-stretch">
                <div class="col-12 col-md-7">
                  <div id="board" class="board">
                    <!-- 9 cells -->
                    <button class="cell" data-index="0" aria-label="cell 1"></button>
                    <button class="cell" data-index="1" aria-label="cell 2"></button>
                    <button class="cell" data-index="2" aria-label="cell 3"></button>
                    <button class="cell" data-index="3" aria-label="cell 4"></button>
                    <button class="cell" data-index="4" aria-label="cell 5"></button>
                    <button class="cell" data-index="5" aria-label="cell 6"></button>
                    <button class="cell" data-index="6" aria-label="cell 7"></button>
                    <button class="cell" data-index="7" aria-label="cell 8"></button>
                    <button class="cell" data-index="8" aria-label="cell 9"></button>
                  </div>
                </div>
                <div class="col-12 col-md-5">
                  <div class="p-3 bg-body-tertiary rounded-3 h-100 d-flex flex-column justify-content-between">
                    <div>
                      <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-semibold">Current Player</span>
                        <span id="current-player" class="badge text-bg-primary">X</span>
                      </div>
                      <div class="small text-muted" id="status-text">Make your move.</div>
                    </div>
                    <hr />
                    <div>
                      <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-semibold">Scores</span>
                      </div>
                      <div class="d-flex gap-3">
                        <div class="flex-fill p-2 rounded border text-center">
                          <div class="small text-muted">Player X</div>
                          <div id="score-x" class="fs-4">0</div>
                        </div>
                        <div class="flex-fill p-2 rounded border text-center">
                          <div class="small text-muted">Player O</div>
                          <div id="score-o" class="fs-4">0</div>
                        </div>
                        <div class="flex-fill p-2 rounded border text-center">
                          <div class="small text-muted">Draws</div>
                          <div id="score-draw" class="fs-4">0</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <p class="text-center text-muted small mt-3 mb-0">Built with Bootstrap 5</p>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (optional for components) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
  </html>
